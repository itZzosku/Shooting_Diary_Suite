<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shooting Diary Suite</title>
<meta name="description" content="Shooting diary: range visits, muzzle velocities, scope zeroes and guns loaned.">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/diary/static/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#e3e6e0; --line:#c9cec4;
  --fg:#1c211c; --muted:#5b6359; --accent:#e2590f; --accent-soft:#fbe3d4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1d211d; --surface-2:#272c27; --line:#363d36;
  --fg:#e8ebe6; --muted:#9aa398; --accent:#ff7a33; --accent-soft:#3a2416; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1d211d; --surface-2:#272c27; --line:#363d36;
  --fg:#e8ebe6; --muted:#9aa398; --accent:#ff7a33; --accent-soft:#3a2416; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--f-body);padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{border-bottom:2px solid var(--fg);padding-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:min(2.6rem,9vw);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--accent)}
header small{color:var(--muted);font-size:.85rem}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
a{color:inherit}
/* Links */
.links{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:2px 14px;align-items:center;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 14px;box-shadow:inset 4px 0 0 var(--accent)}
.card:hover{border-color:var(--muted)}
.card:active{background:var(--surface-2)}
.card .ic{grid-row:1/3;width:46px;height:46px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.card .ic svg{width:24px;height:24px}
.card b{font-family:var(--f-display);font-weight:700;font-size:1.35rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.card .what{grid-column:2;color:var(--muted);font-size:.88rem;line-height:1.35}
.card .go{grid-row:1/3;grid-column:3;color:var(--muted);font-size:1.4rem}
.badge{display:inline-block;font-family:var(--f-body);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:middle}
footer{color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Shooting diary <span>suite</span></h1>
  </header>

  <nav class="links" aria-label="Pages">
    <a class="card" href="/diary/">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg></span>
      <b>Shooting diary<span class="badge">login</span></b><span class="go" aria-hidden="true">›</span>
      <span class="what">Range visits, muzzle velocities, scope zeroes and guns loaned</span>
    </a>
    {% for slug, note in notes.items() %}
    <a class="card" href="/notes/{{ slug }}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>
      <b>{{ note.title }}</b><span class="go" aria-hidden="true">›</span>
      <span class="what">Note</span>
    </a>
    {% endfor %}
  </nav>

  <footer><span>Shooting Diary Suite</span><a href="https://github.com/itZzosku/Shooting_Diary_Suite">Source on GitHub</a></footer>
</div>
</body>
</html>
