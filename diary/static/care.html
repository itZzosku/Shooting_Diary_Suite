<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Torque &amp; care</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shooting Diary">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="static/icons/favicon-32.png">
<link rel="preload" href="static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/fonts/fonts.css">
<style>

/* Layout: single-column range log; licence strip + totals up top, entries by month, entry sheet over the log. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#e3e6e0; --line:#c9cec4;
  --fg:#1c211c; --muted:#5b6359; --accent:#e2590f; --accent-ink:#ffffff; --accent-soft:#fbe3d4;
  --danger:#b3261e;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141714; --surface:#1d211d; --surface-2:#272c27; --line:#363d36;
  --fg:#e8ebe6; --muted:#9aa398; --accent:#ff7a33; --accent-ink:#1a0d05; --accent-soft:#3a2416;
  --danger:#ff8a80; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1d211d; --surface-2:#272c27; --line:#363d36;
  --fg:#e8ebe6; --muted:#9aa398; --accent:#ff7a33; --accent-ink:#1a0d05; --accent-soft:#3a2416;
  --danger:#ff8a80; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{padding-top:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:min(2.4rem,7.6vw);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.85rem;color:var(--fg)}
.ghost:hover{border-color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20}
/* Page switcher (same on every page) */
.pnav{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:max(12px,env(safe-area-inset-top,0px))}
.pnav a{display:flex;align-items:center;justify-content:center;gap:5px;min-height:38px;padding:4px 6px;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:600;font-size:.86rem;white-space:nowrap;overflow:hidden}
.pnav a:hover{background:var(--surface)}
.pnav a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.pnav svg{width:16px;height:16px;flex:0 0 auto}
.pnav a:first-child{padding-inline:12px}
@media (max-width:360px){.pnav a .t{display:none}}
header.top{padding-top:6px!important}

/* Torque & care: every gun's specs and procedures, read here, edited on the gun in the diary */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.lead{color:var(--muted);margin:0}
a.ghost{text-decoration:none;flex:0 0 auto}
.gun{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.gun h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;text-transform:uppercase;letter-spacing:.01em}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gun .sub{color:var(--muted);font-size:.85rem}
.lbl{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:10px}
.tqr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;padding:8px 0;border-top:1px solid var(--line)}
.lbl+.tqr{border-top:0}
.tqr .j{font-weight:600}.tqr .v{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.tqr .m,.tqr .o{color:var(--muted);font-size:.82rem}.tqr .o{text-align:right;white-space:nowrap;font-family:var(--f-mono)}
.tqr .n{grid-column:1/-1;color:var(--muted);font-size:.82rem;white-space:pre-wrap}
.care{white-space:pre-wrap;font-size:.92rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:8px}
.empty{color:var(--muted)}
details.hid summary{cursor:pointer;color:var(--muted);font-weight:600}
@media print{.pnav,.ghost,.chips{display:none!important}.gun{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="pnav" aria-label="Pages"><a href="./" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="t">Home</span></a><a href="log">Diary</a><a href="velocity">Velocity</a><a href="zeroes">Zeroes</a></nav><script src="static/nav.js"></script>
  <header class="top">
    <h1>Torque <span>&amp; care</span></h1>
  </header>
  <p class="lead">Torque specs, lube and procedures for each gun and its mounts. Edit them on the gun (Diary → Guns → Torque &amp; care).</p>
  <div class="chips" id="units" role="group" aria-label="Show torque in"></div>
  <div id="list" style="display:flex;flex-direction:column;gap:14px"><div class="empty">Loading…</div></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NM={"Nm":1,"in-lb":0.112985,"ft-lb":1.355818};
const conv=(v,f,t)=>v*NM[f]/NM[t];
const fmt=(v,u)=>u==="in-lb"?String(Math.round(v)):(v<10?(Math.round(v*10)/10).toFixed(1):String(Math.round(v)));
function txt(r,u){const un=u==="as"?r.unit:u,lo=fmt(conv(r.lo,r.unit,un),un),hi=r.hi!=null?fmt(conv(r.hi,r.unit,un),un):null;
  return(r.max?"≤ ":"")+(hi&&hi!==lo?lo+"–"+hi:lo)+" "+un}
const unit=()=>{try{return localStorage.getItem("tqUnit")||"Nm"}catch(e){return"Nm"}};
let GUNS=null;
function gunHtml(g,u){
  const rows=g.torque||[],parts=[...new Set(rows.map(r=>r.part||""))],care=(g.care||"").trim();
  return`<section class="gun"><div class="ghead"><h2>${esc(g.name)}</h2><a class="ghost" href="log?gun=${encodeURIComponent(g.id)}&tq=1">Edit</a></div>`
    +(g.cal?`<div class="sub">${esc(g.cal)}</div>`:"")
    +(rows.length?parts.map(pt=>`<span class="lbl">${esc(pt||"Gun")}</span>`+rows.filter(r=>(r.part||"")===pt).map(r=>
      `<div class="tqr"><span class="j">${esc(r.joint)}</span><span class="v">${esc(txt(r,u))}</span>`
      +`<span class="m">${esc([r.tool,r.lube].filter(Boolean).join(" · "))}</span><span class="o">${u!=="as"&&u!==r.unit?esc(txt(r,"as")):""}</span>`
      +(r.notes?`<span class="n">${esc(r.notes)}</span>`:"")+`</div>`).join("")).join(""):`<div class="empty">No torque specs yet.</div>`)
    +(care?`<div class="care">${esc(care)}</div>`:"")+`</section>`;
}
function render(){
  const u=unit();
  $("units").innerHTML=[["Nm","Nm"],["in-lb","in-lb"],["ft-lb","ft-lb"],["as","As written"]].map(([v,t])=>`<button type="button" class="chip" data-u="${v}" aria-pressed="${u===v}">${t}</button>`).join("");
  if(!GUNS)return;
  const ord=g=>g.order??99,act=GUNS.filter(g=>!g.archived).sort((a,b)=>ord(a)-ord(b)),hid=GUNS.filter(g=>g.archived);
  const has=g=>(g.torque||[]).length||(g.care||"").trim();
  // guns with specs first, the rest after (so their Edit is one tap away)
  const list=act.filter(has).concat(act.filter(g=>!has(g)));
  $("list").innerHTML=(list.length?list.map(g=>gunHtml(g,u)).join(""):`<div class="empty">No guns yet – add them in the Diary.</div>`)
    +(hid.some(has)?`<details class="hid"><summary>Hidden guns</summary><div style="display:flex;flex-direction:column;gap:14px;margin-top:10px">${hid.filter(has).map(g=>gunHtml(g,u)).join("")}</div></details>`:"");
}
$("units").addEventListener("click",e=>{const b=e.target.closest("[data-u]");if(!b)return;try{localStorage.setItem("tqUnit",b.dataset.u)}catch(x){}render()});
render();
fetch("api/guns",{credentials:"same-origin",headers:{"X-Requested-With":"fetch"}}).then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(g=>{GUNS=Array.isArray(g)?g:[];render()})
  .catch(()=>{$("list").innerHTML=`<div class="empty">Couldn't load the guns – offline? Open this page once online and it works offline after.</div>`});
})();
</script>
</body>
</html>
