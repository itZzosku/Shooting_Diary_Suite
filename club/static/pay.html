<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maksut</title>
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/diary/static/icons/favicon-32.png">
<link rel="preload" href="/diary/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/diary/static/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/diary/static/fonts/fonts.css">
<link rel="stylesheet" href="/ammo/static/club.css">
<style>
.langs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;align-self:flex-start}
.langs button{background:none;border:0;border-radius:999px;padding:6px 11px;font-weight:600;font-size:.85rem;color:var(--fg);min-width:40px}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
header.top{align-items:flex-start}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.prod.on{box-shadow:inset 4px 0 0 var(--accent);border-color:var(--accent)}
.prod b{font-weight:600}
.prod .pr{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.prod small{color:var(--muted);font-size:.82rem;grid-column:1}
.prod .check{gap:12px}
.qty{display:flex;align-items:center;gap:4px;grid-column:2;grid-row:1/3}
.qty button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:1.3rem;line-height:1}
.qty span{min-width:30px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:1.15rem}
.pay+.pay{margin-top:4px}
.pay .what{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker" id="clubName"></div>
      <h1 data-t="title">Maksut</h1>
    </div>
    <div class="langs" role="group" aria-label="Kieli / Språk / Language" id="langs">
      <button type="button" data-lang="fi" lang="fi">FI</button><button type="button" data-lang="sv" lang="sv">SV</button><button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <div class="banner" id="note" hidden></div>
  <div class="msg" id="loadMsg" hidden></div>

  <form id="form" class="wrap" style="gap:16px" autocomplete="on" novalidate hidden>
    <div class="grid2">
      <label class="f"><span data-t="name"></span><input type="text" id="fName" name="name" autocomplete="name" maxlength="60" required></label>
      <label class="f"><span data-t="date"></span><input type="date" id="fDate" required></label>
    </div>
    <div id="prods" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="total"><span class="hint" data-t="total"></span><b id="total">0,00 €</b></div>
    <label class="check"><input type="checkbox" id="fPaid" checked> <span data-t="payNow"></span></label>
    <input class="hp" type="text" id="fWebsite" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="msg" id="msg" hidden></div>
    <button type="submit" class="primary big" id="saveBtn" data-t="save"></button>
  </form>

  <section id="done" class="wrap" style="gap:14px" hidden>
    <div id="pays" style="display:flex;flex-direction:column;gap:12px"></div>
    <button type="button" class="ghost wide" id="again" data-t="again"></button>
  </section>

  <section id="mineBox" hidden>
    <h2 style="margin-bottom:6px" data-t="mine"></h2>
    <div class="rows" id="mine"></div>
  </section>

  <p class="hint" style="margin:0"><a href="/diary/privacy#club" data-t="privacy"></a> · <span data-t="privacyTxt"></span></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const CODE=location.pathname.replace(/\/+$/,"").split("/").pop();
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fiDate=s=>{const[y,m,d]=s.split("-");return +d+"."+ +m+"."+y};
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");
function toast(s){const el=$("toast");el.textContent=s;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
const DEVICE=lsGet("ammo:device")||(()=>{const d=rid();lsSet("ammo:device",d);return d})();
const QK="ammo:payqueue",LAST="ammo:paylast:"+CODE,LAST_MIN=30;
const S={info:null,sel:{},done:null};

const L={
fi:{title:"Maksut",name:"Nimesi",date:"Päivämäärä",total:"Yhteensä",payNow:"Maksan nyt MobilePaylla",save:"Tallenna",again:"Uusi kirjaus",
  mine:"Tällä puhelimella",privacy:"Tietosuoja",privacyTxt:"Nimesi, maksut ja päivä tallentuvat seuran kirjanpitoon. Seuran ylläpitäjät näkevät ne.",
  season:"Kausimaksu – kerran vuodessa",single:"Kertamaksu",merch:"Tuote",left:"{n} jäljellä",deal:"{n} kpl {amt}",
  offline:"Ei yhteyttä – kirjaukset säilyvät puhelimessa ja lähetetään, kun yhteys palaa.",
  badLink:"Tämä linkki ei enää toimi. Skannaa QR-koodi uudelleen tai kysy seuran ylläpitäjältä.",noConn:"Ei yhteyttä. Avaa sivu kerran verkossa, niin se toimii sen jälkeen myös ilman yhteyttä.",
  noProds:"Ei vielä maksettavaa – kysy seuran ylläpitäjältä.",errName:"Kirjoita nimesi.",errPick:"Valitse, mitä maksat.",errDate:"Tarkista päivämäärä.",
  errGone:"Tätä ei enää myydä – lataa sivu uudelleen.",errBusy:"Liian monta kirjausta – yritä myöhemmin uudelleen.",errOld:"Yli 30 minuuttia vanha – pyydä seuran ylläpitäjää korjaamaan.",
  errLeft:"Ei riitä:",saved:"✓ Tallennettu",savedPhone:"✓ Tallennettu puhelimeen",sentLater:"Lähetetään, kun yhteys palaa.",copy:"Kopioi",copied:"Kopioitu",
  openMp:"Avaa MobilePay",payN:"Maksu {i}/{n}",payWith:"Maksa {amt} viestillä",payTo:"MobilePay numeroon",message:"Viesti",
  several:"Tee jokainen maksu erikseen omalla viestillään.",notPaidLater:"Merkitty maksamattomaksi – maksa myöhemmin seuran ylläpitäjälle.",
  sentN:"Lähetetty {n} tallennettua kirjausta",waiting:"odottaa lähetystä",notPaid:"maksamatta",takenBack:"peruttu",ref:"koodi",takeBack:"Peru",
  tapAgain:"Napauta uudelleen perutaksesi",takenToast:"Peruttu",fewer:"Vähemmän",more:"Enemmän"},
sv:{title:"Avgifter",name:"Ditt namn",date:"Datum",total:"Totalt",payNow:"Jag betalar nu med MobilePay",save:"Spara",again:"Ny registrering",
  mine:"På den här telefonen",privacy:"Dataskydd",privacyTxt:"Ditt namn, avgifterna och datumet sparas i föreningens bokföring. Föreningens administratörer ser dem.",
  season:"Säsongsavgift – en gång per år",single:"Engångsavgift",merch:"Produkt",left:"{n} kvar",deal:"{n} st {amt}",
  offline:"Ingen anslutning – registreringarna sparas i telefonen och skickas när anslutningen är tillbaka.",
  badLink:"Länken fungerar inte längre. Skanna QR-koden igen eller fråga en administratör.",noConn:"Ingen anslutning. Öppna sidan en gång med nätverk så fungerar den sedan även utan.",
  noProds:"Inget att betala ännu – fråga en administratör.",errName:"Skriv ditt namn.",errPick:"Välj vad du betalar.",errDate:"Kontrollera datumet.",
  errGone:"Det säljs inte längre – ladda om sidan.",errBusy:"För många registreringar – försök igen senare.",errOld:"Äldre än 30 minuter – be en administratör rätta den.",
  errLeft:"Räcker inte:",saved:"✓ Sparat",savedPhone:"✓ Sparat i telefonen",sentLater:"Skickas när anslutningen är tillbaka.",copy:"Kopiera",copied:"Kopierat",
  openMp:"Öppna MobilePay",payN:"Betalning {i}/{n}",payWith:"Betala {amt} med meddelandet",payTo:"MobilePay till",message:"Meddelande",
  several:"Gör varje betalning för sig, med sitt eget meddelande.",notPaidLater:"Markerad som obetald – betala en administratör senare.",
  sentN:"Skickade {n} sparade registreringar",waiting:"väntar på att skickas",notPaid:"obetald",takenBack:"ångrad",ref:"kod",takeBack:"Ångra",
  tapAgain:"Tryck igen för att ångra",takenToast:"Ångrad",fewer:"Färre",more:"Fler"},
en:{title:"Payments",name:"Your name",date:"Date",total:"Total",payNow:"I'm paying now with MobilePay",save:"Save",again:"New entry",
  mine:"On this phone",privacy:"Privacy",privacyTxt:"Your name, what you paid for and the date go to the club's books. Admins of the club see them.",
  season:"Season fee – once a year",single:"One-time fee",merch:"Item",left:"{n} left",deal:"{n} for {amt}",
  offline:"Offline – entries are kept on this phone and sent when there's a connection.",
  badLink:"This link doesn't work any more. Scan the QR code again, or ask a club admin.",noConn:"No connection. Open this page once while online and it works offline after that.",
  noProds:"Nothing to pay yet – ask a club admin.",errName:"Write your name.",errPick:"Pick what you pay for.",errDate:"Check the date.",
  errGone:"That isn't for sale any more – reload the page.",errBusy:"Too many entries from here – try again later.",errOld:"Older than 30 minutes – ask a club admin to fix it.",
  errLeft:"Not enough left:",saved:"✓ Saved",savedPhone:"✓ Saved on this phone",sentLater:"It's sent when there's a connection.",copy:"Copy",copied:"Copied",
  openMp:"Open MobilePay",payN:"Payment {i}/{n}",payWith:"Pay {amt} with the message",payTo:"MobilePay to",message:"Message",
  several:"Make each payment separately, with its own message.",notPaidLater:"Marked as not paid yet – pay a club admin later.",
  sentN:"Sent {n} saved entries",waiting:"waiting to be sent",notPaid:"not paid",takenBack:"taken back",ref:"ref",takeBack:"Take back",
  tapAgain:"Tap again to take back",takenToast:"Taken back",fewer:"Fewer",more:"More"}};
let LANG=lsGet("ammo:lang")||((navigator.language||"").toLowerCase().startsWith("sv")?"sv":"fi");
if(!L[LANG])LANG="fi";
const t=(k,v)=>{let s=L[LANG][k]||L.en[k]||k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const eur=n=>{const s=(Math.round((+n||0)*100)/100).toFixed(2);return(LANG!=="en"?s.replace(".",","):s)+" €"};
const SERVER_ERR=[["Write your name","errName"],["Check the date","errDate"],["Pick what","errPick"],["That isn't","errGone"],
  ["Too many","errBusy"],["Older than","errOld"],["not_found","badLink"]];
const tErr=m=>{if(String(m).startsWith("Only "))return t("errLeft")+" "+String(m).replace(/^Only \d+ left: /,"");
  const hit=SERVER_ERR.find(([p])=>String(m).startsWith(p));return hit?t(hit[1]):m};

function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("#langs [data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.title=t("title")+(S.info?" · "+S.info.club.name:"");
  if(S.info){renderProds();if(S.done)showDone(S.done.r,S.done.q,true);loadMine()}
  if(!$("note").hidden)note(t("offline"));
}
$("langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;LANG=b.dataset.lang;lsSet("ammo:lang",LANG);applyLang()});
function note(s){$("note").textContent=s;$("note").hidden=!s}

async function api(method,path,body){
  const r=await fetch("/ammo/api/"+path,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.headers.get("X-Offline"))note(t("offline"));
  if(!r.ok){const e=new Error(tErr((j&&j.error)||("HTTP "+r.status)));if(!(j&&j.error==="offline"))e.status=r.status;throw e}
  return j;
}

async function load(){
  let info=null;
  try{info=await api("GET","p/"+CODE);lsSet("ammo:pay:"+CODE,info)}
  catch(e){
    if(e.status===404){$("loadMsg").textContent=t("badLink");$("loadMsg").hidden=false;return}
    info=lsGet("ammo:pay:"+CODE);
    if(!info){$("loadMsg").textContent=t("noConn");$("loadMsg").hidden=false;return}
    note(t("offline"));
  }
  S.info=info;$("clubName").textContent=info.club.name;
  if(!info.products.length){$("loadMsg").textContent=t("noProds");$("loadMsg").hidden=false;return}
  $("fName").value=(info.me&&info.me.name)||lsGet("ammo:name")||"";
  $("fDate").value=today();$("fDate").max=today();
  $("form").hidden=false;
  const last=lsGet(LAST);
  if(last&&Date.now()-last.t<LAST_MIN*60000){S.sel=last.sel||{};showDone(last.r,last.q)}else lsSet(LAST,null);
  applyLang();
}

/* ---- what is paid for: season / one-time fees are ticked, merch has a count ---- */
const prod=id=>S.info.products.find(p=>p.id===id);
// € for n of a product: every full deal_qty costs deal_price, the rest the single price (same rule as the server)
const linePrice=(p,n)=>p.deal_qty>1&&p.deal_price>0?Math.floor(n/p.deal_qty)*p.deal_price+(n%p.deal_qty)*p.price:n*p.price;
function renderProds(){
  $("prods").innerHTML=S.info.products.map(p=>{const n=S.sel[p.id]||0,
    sub=p.kind==="merch"?[p.deal_qty>1&&p.deal_price>0?t("deal",{n:p.deal_qty,amt:eur(p.deal_price)}):"",p.stock!=null?t("left",{n:p.stock}):""].filter(Boolean).join(" · ")||t("merch"):t(p.kind);
    return p.kind==="merch"
      ?`<div class="prod${n?" on":""}" data-p="${p.id}"><b>${esc(p.name)} <span class="pr">${eur(p.price)}</span></b>
          <div class="qty"><button type="button" data-d="-1" aria-label="${t("fewer")}">−</button><span>${n}</span><button type="button" data-d="1" aria-label="${t("more")}">+</button></div>
          <small>${esc(sub)}</small></div>`
      :`<label class="prod${n?" on":""}" data-p="${p.id}"><span class="check"><input type="checkbox" ${n?"checked":""}> <b>${esc(p.name)}</b></span>
          <span class="pr">${eur(p.price)}</span><small style="padding-left:34px">${esc(sub)}</small></label>`}).join("");
  total();
}
function total(){$("total").textContent=eur(Object.entries(S.sel).reduce((a,[id,n])=>a+(prod(+id)?linePrice(prod(+id),n):0),0))}
$("prods").addEventListener("change",e=>{const el=e.target.closest("[data-p]");if(!el||e.target.type!=="checkbox")return;
  S.sel[el.dataset.p]=e.target.checked?1:0;el.classList.toggle("on",e.target.checked);total()});
$("prods").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;const id=+b.closest("[data-p]").dataset.p,p=prod(id);
  const max=p.stock!=null?p.stock:100;S.sel[id]=Math.max(0,Math.min(max,(S.sel[id]||0)+ +b.dataset.d));renderProds()});

/* ---- save; offline it waits on the phone ---- */
$("form").addEventListener("submit",async e=>{
  e.preventDefault();$("msg").hidden=true;
  const name=$("fName").value.trim().replace(/\s+/g," ");
  const lines=Object.entries(S.sel).filter(([id,n])=>n>0&&prod(+id)).map(([id,n])=>({product:+id,qty:n}));
  const err=name.length<2?t("errName"):!lines.length?t("errPick"):"";
  if(err){$("msg").textContent=err;$("msg").hidden=false;return}
  lsSet("ammo:name",name);
  const body={name,date:$("fDate").value||today(),lines,paid:$("fPaid").checked,device:DEVICE,client_id:rid(),website:$("fWebsite").value};
  $("saveBtn").disabled=true;
  try{showDone(await api("POST","p/"+CODE+"/pay",body))}
  catch(err){
    if(err.status){$("msg").textContent=err.message;$("msg").hidden=false}
    else{const q=lsGet(QK)||[];q.push({code:CODE,body});lsSet(QK,q);showDone(null,body)}
  }finally{$("saveBtn").disabled=false}
});

function showDone(r,queued,again){
  S.done={r,q:queued};
  const C=t("copy"),mp=S.info.club.mobilepay,paying=r?r.paid:queued.paid;
  let html;
  if(!r){
    const amt=queued.lines.reduce((a,l)=>a+(prod(l.product)?linePrice(prod(l.product),l.qty):0),0);
    html=`<div class="pay"><div class="ok">${t("savedPhone")}</div><div class="hint">${t("sentLater")}</div><div class="amt">${eur(amt)}</div></div>`;
  }else{
    const n=r.pays.length;
    html=`<div class="ok" style="text-align:center">${t("saved")}</div>`+(n>1&&paying?`<p class="hint" style="margin:0;text-align:center">${t("several")}</p>`:"")+
      r.pays.map((p,i)=>`<div class="pay">${n>1?`<div class="kicker">${t("payN",{i:i+1,n})}</div>`:""}
        <div class="what">${esc(p.names.join(", "))}</div>
        <div class="amt">${eur(p.total)} <button type="button" class="copy" data-copy="${(+p.total).toFixed(2).replace(".",",")}">${C}</button></div>
        ${!paying?"":p.pay_url?`<a class="primary big" style="text-decoration:none;display:block" href="${esc(p.pay_url)}">${t("openMp")}</a>
            <div class="hint">${t("payWith",{amt:eur(p.total)})}<br><b class="num" style="white-space:nowrap">${esc(p.msg)}</b> <button type="button" class="copy" data-copy="${esc(p.msg)}">${C}</button></div>`
          :`${mp?`<div class="to">${t("payTo")} <b>${esc(mp)}</b> <button type="button" class="copy" data-copy="${esc(mp)}">${C}</button></div>`:""}
            <div class="ref">${t("message")}: <b>${esc(p.msg)}</b> <button type="button" class="copy" data-copy="${esc(p.msg)}">${C}</button></div>`}
      </div>`).join("")+(!paying?`<p class="hint" style="margin:0;text-align:center">${t("notPaidLater")}</p>`:"");
  }
  $("pays").innerHTML=html;
  if(again)return;
  lsSet(LAST,{r,q:queued,sel:S.sel,t:Date.now()});
  $("form").hidden=true;$("done").hidden=false;window.scrollTo(0,0);loadMine();
}
$("pays").addEventListener("click",async e=>{const b=e.target.closest("[data-copy]");if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.copy);toast(t("copied"))}catch(err){toast(b.dataset.copy)}});
$("again").addEventListener("click",()=>{S.done=null;lsSet(LAST,null);S.sel={};$("fDate").value=today();$("done").hidden=true;$("form").hidden=false;renderProds()});

async function flush(){
  const q=lsGet(QK)||[];if(!q.length)return;const left=[];
  for(const x of q){try{await api("POST","p/"+x.code+"/pay",x.body)}catch(e){if(!e.status||e.status===429)left.push(x)}}
  lsSet(QK,left);
  if(left.length<q.length){toast(t("sentN",{n:q.length-left.length}));note("");loadMine()}
}

async function loadMine(){
  let r;try{r=await api("POST","p/"+CODE+"/mine",{device:DEVICE})}catch(e){return}
  const q=(lsGet(QK)||[]).filter(x=>x.code===CODE),lim=(S.info&&S.info.withdraw_min||30)*60000;
  $("mineBox").hidden=!(r.entries.length||q.length);
  $("mine").innerHTML=q.map(x=>`<div class="row"><div class="what">${fiDate(x.body.date)} · ${esc(x.body.lines.map(l=>(prod(l.product)||{}).name).join(", "))}<br><small>${esc(x.body.name)} · ${t("waiting")}</small></div><div class="r num">…</div></div>`).join("")+
    r.entries.map(x=>{const open=!x.voided&&Date.now()-Date.parse(x.at)<lim;
      return`<div class="row${x.voided?" void":""}"><div class="what">${fiDate(x.date)} · ${esc(x.lines.map(l=>l.name+(l.qty>1?" × "+l.qty:"")).join(", "))}${x.paid?"":`<span class="tag warn">${t("notPaid")}</span>`}${x.voided?`<span class="tag">${t("takenBack")}</span>`:""}<br>
        <small>${t("ref")} <b class="num">${esc(x.ref)}</b></small></div>
        <div class="r"><div class="num">${eur(x.total)}</div>${open?`<button type="button" class="link" data-wd="${x.grp}">${t("takeBack")}</button>`:""}</div></div>`}).join("");
}
$("mine").addEventListener("click",async e=>{const b=e.target.closest("[data-wd]");if(!b)return;
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent=t("tapAgain");return}
  try{await api("POST","p/"+CODE+"/withdraw/"+b.dataset.wd,{device:DEVICE});toast(t("takenToast"));
    const last=lsGet(LAST);if(last&&last.r&&last.r.grp===b.dataset.wd){lsSet(LAST,null);S.done=null;S.sel={};$("done").hidden=true;$("form").hidden=false;renderProds()}
    loadMine()}catch(err){toast(err.message)}});

window.addEventListener("online",flush);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/ammo/sw.js",{scope:"/ammo/"}).catch(()=>{});
applyLang();
load().then(flush);
</script>
</body>
</html>
