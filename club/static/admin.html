<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Club ammo</title>
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/diary/static/icons/favicon-32.png">
<link rel="stylesheet" href="/diary/static/fonts/fonts.css">
<link rel="stylesheet" href="/ammo/static/club.css">
<style>
.cal{margin-top:6px}
.calhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--fg);padding-bottom:6px;margin-bottom:4px}
.calhead b{font-family:var(--f-mono);font-size:1.4rem}
.box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:var(--fg)}
.box:hover{background:var(--surface-2)}
.box b{font-weight:600}
.box .n{font-family:var(--f-mono);font-size:1.3rem;font-weight:600;text-align:right}
.box small{color:var(--muted);font-size:.82rem}
.box.arch{opacity:.5}
.box.bx{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.box .bh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.crows{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--line)}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.crow small{color:var(--muted);font-size:.8rem}
.crow .num{font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.9rem;font-weight:600}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);z-index:1}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;font-weight:600;text-align:center}
.acts button:hover{border-color:var(--fg)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum div{padding:10px 4px}
.sum div+div{border-left:1px solid var(--line);padding-left:12px}
.sum b{display:block;font-family:var(--f-mono);font-size:1.2rem;font-weight:600;white-space:nowrap}
.link.quiet{color:var(--muted);font-weight:400;font-size:.82rem}
.sum small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.lnk{font-family:var(--f-mono);font-size:.82rem;overflow-wrap:anywhere;background:var(--surface-2);border-radius:6px;padding:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:9px 0}
.irow:first-child{border-top:0}
.langs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{background:none;border:0;border-radius:999px;padding:6px 11px;font-weight:600;font-size:.85rem;color:var(--fg);min-width:40px}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sarow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start}
.sarow b{font-size:.85rem;font-weight:600;padding-top:6px}
.sarow span{display:flex;flex-wrap:wrap;gap:5px}
.sachip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:600;color:var(--fg)}
.sachip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style>
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <div>
      <div class="kicker"><span data-t="Club ammo"></span><span id="roleTxt"></span></div>
      <h1 id="clubName">&nbsp;</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="langs" role="group" aria-label="Kieli / Language" id="langs"><button type="button" data-lang="fi">FI</button><button type="button" data-lang="en">EN</button></div>
      <a class="ghost" href="/diary/">Shooting Diary</a>
    </div>
  </header>

  <div id="warn" style="display:flex;flex-direction:column;gap:6px"></div>

  <div class="tabs" role="tablist">
    <button class="tab" data-tab="stock" aria-pressed="true" data-t="Stock"></button>
    <button class="tab" data-tab="log" aria-pressed="false" data-t="Log & payments"></button>
    <button class="tab" data-tab="fees" aria-pressed="false" id="feesTab" data-t="Season fees"></button>
    <button class="tab" data-tab="match" aria-pressed="false" id="matchTab" data-t="Matches"></button>
    <button class="tab" data-tab="setup" aria-pressed="false" id="setupTab" data-t="Setup"></button>
  </div>

  <!-- Stock -->
  <section id="tStock" style="display:flex;flex-direction:column;gap:18px">
    <div id="stock"></div>
    <div class="actions" id="stockActs" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </section>

  <!-- Log -->
  <section id="tLog" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="grid2">
      <label class="f"><span data-t="Month"></span><select id="lMonth"></select></label>
      <label class="f"><span data-t="Show"></span><select id="lKind"><option value="" data-t="Everything"></option><option value="use" data-t="Shooters' entries"></option>
        <option value="unpaid" data-t="Not paid"></option><option value="fees" data-t="Fees & merch"></option><option value="stock" data-t="Refills, moves, counts, hand-overs"></option></select></label>
    </div>
    <div class="sum" id="lSum"></div>
    <label class="f"><span data-t="Find a name or reference"></span><input type="search" id="lFind" data-tp="e.g. Matti, A7K3 or the whole message"></label>
    <label class="check"><input type="checkbox" id="lHideVoid"> <span data-t="Hide voided"></span></label>
    <div class="rows" id="log"></div>
    <p class="hint" id="logHint"></p>
    <div id="exportRow"><button type="button" class="ghost" id="exportBtn" data-t="Export for the treasurer…"></button></div>
  </section>

  <!-- Season fees (admins): who has paid this year – for the match desk -->
  <section id="tFees" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="grid2">
      <label class="f"><span data-t="Year"></span><select id="fYear"></select></label>
      <label class="f"><span data-t="Find a name"></span><input type="search" id="fFind" data-tp="e.g. Matti"></label>
    </div>
    <div class="hint" id="fSum"></div>
    <div class="rows" id="fees"></div>
  </section>

  <!-- Matches (admins): competitors from SSI, officers' counts per stage, reconciliation -->
  <section id="tMatch" hidden style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:8px;align-items:flex-end">
      <label class="f" style="flex:1;min-width:0"><span data-t="Match"></span><select id="mSel"></select></label>
      <button type="button" class="ghost" id="mNew" data-t="+ Match"></button>
    </div>
    <div id="mBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <!-- Setup (admins) -->
  <section id="tSetup" hidden style="display:flex;flex-direction:column;gap:22px">
    <form id="clubForm" class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2 data-t="Club"></h2>
      <div class="grid2">
        <label class="f"><span data-t="Name"></span><input type="text" id="cName" maxlength="80"></label>
        <label class="f"><span data-t="MobilePay number"></span><input type="text" id="cMp" maxlength="40" data-tp="e.g. 12345"></label>
      </div>
      <label class="f"><span data-t="Payment message (ammo)"></span><input type="text" id="cMsg" maxlength="40" data-tp="e.g. HARRASTEMAKSU"></label>
      <p class="hint" style="margin:-4px 0 0" data-th="hintClubMsg"></p>
      <div><button class="primary" type="submit" data-t="Save"></button></div>
    </form>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 data-t="Ammo & prices"></h2><button class="ghost" id="addItem" type="button" data-t="+ Ammo"></button></div>
      <p class="hint" style="margin:6px 0 4px" data-t="hintItems"></p>
      <div id="items"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 data-t="Boxes"></h2><span style="display:flex;gap:8px"><a class="ghost" href="qr" data-t="Print QR stickers"></a><button class="ghost" id="addBox" type="button" data-t="+ Box"></button></span></div>
      <p class="hint" style="margin:6px 0 4px" data-t="hintBoxes"></p>
      <div id="boxList"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 data-t="Fees & merch"></h2><button class="ghost" id="addProd" type="button" data-t="+ Fee / item"></button></div>
      <p class="hint" style="margin:6px 0 4px" data-t="hintProds"></p>
      <div id="prodList"></div>
    </div>
    <div class="card">
      <h2 data-t="Payments page"></h2>
      <p class="hint" style="margin:6px 0 8px" data-t="hintPayPage"></p>
      <div class="lnk" id="payUrl"></div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button type="button" class="ghost" id="payCopy" data-t="Copy link"></button><a class="ghost" id="payOpen" target="_blank" rel="noopener" data-t="Open"></a>
        <a class="ghost" href="qr?pay=1" data-t="Print sticker"></a><button type="button" class="ghost" id="payNew" data-t="New link…"></button></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 data-t="Admins and officers"></h2><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ghost" id="addAdmin" type="button" data-t="+ Admin"></button><button class="ghost" id="addOfficer" type="button" data-t="+ Officer"></button></div></div>
      <p class="hint" style="margin:6px 0 4px" data-t="hintAdmins"></p>
      <div id="people"></div>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <form class="sheet-in" id="sForm" novalidate>
    <div class="sheet-bar"><h2 id="sTitle"></h2><div style="display:flex;gap:8px"><button type="button" class="ghost" id="sClose" data-t="Close"></button></div></div>
    <div id="sBody" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="msg" id="sMsg" hidden></div>
    <div id="sFoot"><button class="primary" type="submit" id="sSave" style="width:100%"></button></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/ammo/static/admin_fi.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const SLUG=location.pathname.split("/")[2];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>String(Math.round(+n||0));          // plain digits: 1130, -40
const fiDate=s=>{const[y,m,d]=String(s).split("-");return +d+"."+ +m+"."+y};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---- language: Finnish or English (admin_fi.js holds the Finnish); remembered on this phone ---- */
let LANG=lsGet("ammo:adminlang")||((navigator.language||"").toLowerCase().startsWith("fi")?"fi":"en");
const T=(s,v)=>{let r=(LANG==="fi"&&ADMIN_FI[s])||ADMIN_EN[s]||s;if(v)for(const k in v)r=r.split("{"+k+"}").join(v[k]);return r};
const eur=n=>{const s=(Math.round((+n||0)*100)/100).toFixed(2);return(LANG==="fi"?s.replace(".",","):s)+" €"};
const SERVER_ERR={in_use:"inUse"};
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("#langs [data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el=>el.innerHTML=T(el.dataset.th));
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=T(el.dataset.tp));
  $("sSave").textContent=T("Save");
  if(S.club){renderHead();renderWarn();renderStock();if(isAdmin())renderSetup();if(LOG&&!$("tLog").hidden)renderLog();if(FEES&&!$("tFees").hidden)renderFees();if(MS&&!$("tMatch").hidden)renderMatch()}
}
$("langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;LANG=b.dataset.lang;lsSet("ammo:adminlang",LANG);applyLang()});

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}
async function api(method,path,body){
  const r=await fetch("/ammo/api/"+path,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401){location.href="/diary/login";throw new Error("login")}
  if(!r.ok){const m=(j&&j.error)||(r.status===403?"Not allowed.":"HTTP "+r.status);throw new Error(T(SERVER_ERR[m]||m))}
  return j;
}
let S={},LOG=null,FEES=null;
const isAdmin=()=>S.role==="admin";
const boxOf=id=>S.boxes.find(b=>b.id===id);
const itemOf=id=>S.items.find(i=>i.id===id);
const itemName=i=>i?(i.name||i.calibre):"";
const mayBox=b=>isAdmin()||b.mine;
const boxUrl=b=>b.code?location.origin+"/ammo/"+SLUG+"/"+b.code:"";
const SHOW={items:false,boxes:false,prods:false};          // archived rows shown in Setup

async function load(){
  S=await api("GET","c/"+SLUG);
  renderHead();renderWarn();renderStock();if(isAdmin())renderSetup();
}
function renderHead(){
  document.title=S.club.name+" · "+T("Club ammo");$("clubName").textContent=S.club.name;
  $("roleTxt").textContent=" · "+T(isAdmin()?"admin":"box holder");
  $("setupTab").hidden=!isAdmin();$("matchTab").hidden=!isAdmin();$("feesTab").hidden=!isAdmin();
}

/* ---- warnings ---- */
function renderWarn(){
  $("warn").innerHTML=S.warnings.map(w=>w.kind==="merch"?`<div class="banner">${T("warnMerch",{name:"<b>"+esc(w.name)+"</b>",n:fmt(w.n),low:fmt(w.low)})}</div>`
    :w.kind==="box"?`<div class="banner">${T("warnBox",{name:"<b>"+esc(w.name+(w.calibre?" "+w.calibre:""))+"</b>",n:fmt(w.n),low:fmt(w.low)})}</div>`
    :`<div class="banner" style="border:1px solid var(--accent)">${T("warnCal",{cal:"<b>"+esc(w.calibre)+"</b>",n:fmt(w.n),low:fmt(w.low)})}</div>`).join("");
}

/* ---- stock ---- */
function renderStock(){
  // Each box first, and under it what's in it per calibre (and per ammo when a calibre has several);
  // below the boxes the calibres over all boxes with their buy-more levels
  const active=S.boxes.filter(b=>!b.archived).sort((a,b)=>a.name.localeCompare(b.name,"fi"));
  const merch=(S.products||[]).filter(p=>p.track&&!p.archived);
  const merchHtml=merch.length?`<div class="cal"><div class="calhead"><h2>${T("Merch")}</h2></div>${merch.map(p=>
    `<button class="box" type="button" data-pm="${p.id}"><span><b>${esc(p.name)}</b>${p.low&&p.stock<p.low?`<span class="tag warn">${T("low")}</span>`:""}<br><small>${eur(p.price)}${p.low?" · "+T("warn below {n}",{n:fmt(p.low)}):""}</small></span><span class="n">${fmt(p.stock)}</span></button>`).join("")}</div>`:"";
  if(!active.length){$("stock").innerHTML=`<div class="card hint">${T("No boxes yet.")}${isAdmin()?" "+T("Add ammo prices and boxes on Setup."):""}</div>`+merchHtml;$("stockActs").innerHTML="";return}
  // A box is low when any of its calibres is below that calibre's refill level in this box
  const calN=(b,c)=>S.items.filter(i=>i.calibre===c).reduce((a,i)=>a+(b.stock[i.id]||0),0);
  const low=b=>Object.entries(b.lows||{}).some(([c,lw])=>calN(b,c)<lw);
  const boxes=active.map(b=>{
    const rows=b.cals.map(c=>{const its=S.items.filter(i=>i.calibre===c&&(b.stock[i.id]||!i.archived)),
        n=its.reduce((a,i)=>a+(b.stock[i.id]||0),0),
        parts=its.filter(i=>b.stock[i.id]).map(i=>`${esc(i.name||T("Default"))} ${fmt(b.stock[i.id])}`),lw=(b.lows||{})[c];
      return`<div class="crow"><span>${esc(c)}${parts.length>1||(parts.length===1&&its.find(i=>b.stock[i.id]).name)?` <small>${parts.join(" · ")}</small>`:""}
        ${lw&&n<lw?`<span class="tag warn">${T("refill")}</span>`:""}${lw?` <small>${T("refill below {n}",{n:fmt(lw)})}</small>`:""}</span>
        <span style="white-space:nowrap"><span class="num">${fmt(n)}</span>${isAdmin()?` <button class="link" type="button" data-lowbox="${b.id}" data-cal="${esc(c)}" style="margin-left:8px">${T("Level")}</button>`:""}</span></div>`}).join("");
    return`<div class="box bx" role="button" tabindex="0" data-box="${b.id}">
      <span class="bh"><span><b>${esc(b.name)}</b>${low(b)?`<span class="tag warn">${T("refill")}</span>`:""}${b.mine?`<span class="tag">${T("yours")}</span>`:""}
        <br><small>${b.holder_name?T("Held by {name}",{name:esc(b.holder_name)}):T("No holder")}</small></span></span>
      <span class="crows">${rows}</span></div>`}).join("");
  const allCals=[...new Set(active.flatMap(b=>b.cals))];
  const cals=`<div class="cal" style="margin-top:22px"><div class="calhead"><h2>${T("Calibres in all boxes")}</h2></div>${allCals.map(c=>{const tot=(S.cal_totals||{})[c]||0,lv=S.levels[c];
    return`<div class="crow" style="padding:8px 2px;border-bottom:1px solid var(--line)"><span>${esc(c)}${lv?` <span class="tag ${tot<lv?"bad":""}">${T("buy below {n}",{n:fmt(lv)})}</span>`:""}</span>
      <span><b class="num">${fmt(tot)}</b>${isAdmin()&&lv?` <button class="link quiet" type="button" data-level="${esc(c)}" style="margin-left:8px">${T("Level")}</button>`:""}</span></div>`}).join("")}</div>`;
  const any=S.boxes.some(b=>!b.archived&&mayBox(b));
  // Refill / Move / Count right under the boxes
  $("stock").innerHTML=`<div class="cal"><div class="calhead"><h2>${T("Boxes")}</h2></div>${boxes}<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${any?`<button class="ghost" type="button" data-act="buy">${T("+ Refill")}</button><button class="ghost" type="button" data-act="move">${T("Move")}</button><button class="ghost" type="button" data-act="count">${T("Count")}</button>`:""}</div></div>`+cals+merchHtml;
  $("stockActs").innerHTML="";
}
$("stock").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-box]"))boxSheet(boxOf(+e.target.dataset.box))});
$("stock").addEventListener("click",e=>{const lb=e.target.closest("[data-lowbox]");if(lb)return boxLowSheet(boxOf(+lb.dataset.lowbox),lb.dataset.cal);
  const b=e.target.closest("[data-box]");if(b)return boxSheet(boxOf(+b.dataset.box));
  const pm=e.target.closest("[data-pm]");if(pm)return merchSheet(S.products.find(p=>p.id===+pm.dataset.pm));
  const ac=e.target.closest("[data-act]");if(ac)return moveSheet(ac.dataset.act,null);
  const l=e.target.closest("[data-level]");if(l)levelSheet(l.dataset.level)});
$("stockActs").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)moveSheet(b.dataset.act,null)});

/* ---- sheet ---- */
let onSave=null;
function sheet(title,html,save,label){
  $("sTitle").textContent=title;$("sBody").innerHTML=html;$("sMsg").hidden=true;onSave=save;
  $("sFoot").hidden=!save;$("sSave").textContent=label||T("Save");$("sheet").hidden=false;document.body.style.overflow="hidden";$("sheet").scrollTop=0;
  $("sBody").onclick=null;$("sBody").onchange=null;$("sBody").oninput=null;
}
function closeSheet(){$("sheet").hidden=true;document.body.style.overflow="";onSave=null;$("sBody").innerHTML=""}
$("sClose").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
$("sForm").addEventListener("submit",async e=>{e.preventDefault();if(!onSave)return;$("sSave").disabled=true;
  try{await onSave();closeSheet();await load();if(!$("tLog").hidden)loadLog()}
  catch(err){$("sMsg").textContent=err.message;$("sMsg").hidden=false}finally{$("sSave").disabled=false}});
const v=id=>($(id)||{}).value;
// "Delete…" in an edit sheet: tap twice; only works for something never used
function delButton(path){
  $("sBody").onclick=async e=>{const b=e.target.closest("[data-del]");if(!b)return;
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent=T("Tap again to delete");return}

let LOG_BOX=null;
async function loadLog(){
  const m=$("lMonth").value||today().slice(0,7);
  LOG=await api("GET",`c/${SLUG}/log?month=${m}`+(LOG_BOX?`&box=${LOG_BOX}`:""));
  const months=[...new Set([today().slice(0,7)].concat(LOG.months))].sort().reverse();
  $("lMonth").innerHTML=months.map(x=>`<option value="${x}" ${x===LOG.month?"selected":""}>${+x.slice(5)}/${x.slice(0,4)}</option>`).join("");
  renderLog();
}
function renderLog(){
  const f=$("lKind").value,q=$("lFind").value.trim().toLowerCase();
  const groups=[];const by={};
  LOG.moves.forEach(r=>{if(!by[r.grp]){by[r.grp]={...r,rows:[]};groups.push(by[r.grp])}by[r.grp].rows.push(r)});
  const uses=groups.filter(g=>g.kind==="use"&&!g.voided_at),pays=groups.filter(g=>(g.kind==="use"||g.kind==="sale")&&!g.voided_at);
  const amt=g=>g.rows.reduce((a,r)=>a+(g.kind==="sale"?(r.amount!=null?r.amount:r.qty*(r.price||0)):-r.qty*(r.price||0)),0);
  const paid=pays.filter(g=>g.paid).reduce((a,g)=>a+amt(g),0),unpaid=pays.filter(g=>!g.paid).reduce((a,g)=>a+amt(g),0);
  $("lSum").innerHTML=`<div><b>${fmt(uses.reduce((a,g)=>a+g.rows.reduce((x,r)=>x-r.qty,0),0))}</b><small>${T("rounds shot")}</small></div>
    <div><b>${eur(paid)}</b><small>${T("paid (MobilePay)")}</small></div><div><b style="${unpaid?"color:var(--accent)":""}">${eur(unpaid)}</b><small>${T("not paid")}</small></div>`;
  const FEEK=["sale","prefill","pcount"];
  const list=groups.filter(g=>!f||(f==="use"?g.kind==="use":f==="unpaid"?(g.kind==="use"||g.kind==="sale")&&!g.paid&&!g.voided_at
      :f==="fees"?FEEK.includes(g.kind):g.kind!=="use"&&!FEEK.includes(g.kind)))
    .filter(g=>!($("lHideVoid").checked&&g.voided_at))
    .filter(g=>!q||(g.name||"").toLowerCase().includes(q)||(!!g.ref&&q.split(/\s+/).includes(g.ref.toLowerCase())));   // "harrastemaksu a7k3" finds A7K3
  const K={use:"",buy:T("Refill"),move:T("Move"),count:T("Count"),handover:T("Hand-over")};
  const unpaidTag=`<span class="tag warn">${T("not paid")}</span>`,meta=g=>`${fiDate(g.date)}${g.by?" · "+esc(g.by):""}${g.note?" · "+esc(g.note):""}`;
  $("log").innerHTML=list.length?list.map(g=>{
    const vd=!!g.voided_at,r0=g.rows[0];let what,right;
    if(g.kind==="use"){const n=g.rows.reduce((a,r)=>a-r.qty,0);
      what=`<b>${esc(g.name||T("Shooter"))}</b> · ${fmt(n)} × ${esc(g.rows.map(r=>r.iname||r.ical).join(", "))}${g.paid?"":unpaidTag}
        <br><small>${fiDate(g.date)} · ${esc(g.bname)} · ${T("ref")} <b class="num">${esc(g.ref)}</b></small>`;right=eur(amt(g))}
    else if(g.kind==="move"){const out=g.rows.find(r=>r.qty<0),inn=g.rows.find(r=>r.qty>0);
      what=`${T("Move")} ${fmt(inn.qty)} ${esc(inn.iname||inn.ical)} · ${esc(out.bname)} → ${esc(inn.bname)}<br><small>${meta(g)}</small>`;right=""}
    else if(g.kind==="sale"){
      what=`<b>${esc(g.name)}</b> · ${esc(g.rows.map(r=>r.pname+(r.qty>1?" × "+r.qty:"")).join(", "))}${g.paid?"":unpaidTag}
        <br><small>${fiDate(g.date)} · ${T("ref")} <b class="num">${esc(g.ref)}</b></small>`;right=eur(amt(g))}
    else if(g.kind==="prefill"||g.kind==="pcount"){
      what=`${T(g.kind==="prefill"?"Refill":"Count")} · ${esc(r0.pname)}<br><small>${meta(g)}</small>`;right=(r0.qty>0?"+":"")+fmt(r0.qty)}
    else if(g.kind==="handover"){what=`${T("{box} handed to {name}",{box:esc(r0.bname),name:"<b>"+esc(g.name)+"</b>"})}<br><small>${meta(g)}</small>`;right=""}
    else{what=`${K[g.kind]} · ${esc(r0.bname)} · ${esc(r0.iname||r0.ical)}<br><small>${meta(g)}</small>`;right=(r0.qty>0?"+":"")+fmt(r0.qty)}
    return`<div class="row${vd?" void":""}"><div class="what">${what}${vd?`<br><small>${g.voided_by_name?T("Voided by {name}",{name:esc(g.voided_by_name)}):T("Voided")}${g.note&&(g.kind==="use"||g.kind==="sale")?" · "+esc(g.note):""}</small>`:""}</div>
      <div class="r"><div class="num">${right}</div>${isAdmin()&&g.kind!=="handover"?`<button class="link" type="button" data-void="${g.grp}" data-undo="${vd?1:""}">${T(vd?"Restore":"Void")}</button>`:""}
      ${isAdmin()&&(g.kind==="use"||g.kind==="sale")&&!vd?`<br><button class="link${g.paid?" quiet":""}" type="button" data-paid="${g.grp}" data-to="${g.paid?"":1}">${T(g.paid?"Not paid?":"Mark paid")}</button>`:""}</div></div>`}).join("")
    :`<div class="hint">${T("Nothing here.")}</div>`;
  $("logHint").innerHTML=(LOG_BOX?`${T("Only box {name}",{name:"<b>"+esc((boxOf(LOG_BOX)||{}).name)+"</b>"})} · <button class="link" type="button" id="allBoxes">${T("all boxes")}</button>. `:"")+
    T(isAdmin()?"hintLogAdmin":"hintLogHolder");
  const ab=$("allBoxes");if(ab)ab.onclick=()=>{LOG_BOX=null;loadLog()};
}

/* ---- treasurer's export: PDF (made here), Excel and CSV (from the server) ---- */
function periodOf(p){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,pad=n=>String(n).padStart(2,"0"),last=(yy,mm)=>new Date(yy,mm,0).getDate();
  if(p==="month")return[`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${last(y,m)}`];
  if(p==="lastmonth"){const yy=m===1?y-1:y,mm=m===1?12:m-1;return[`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${last(yy,mm)}`]}
  if(p==="year")return[`${y}-01-01`,`${y}-12-31`];
  if(p==="lastyear")return[`${y-1}-01-01`,`${y-1}-12-31`];
  return[v("xFrom"),v("xTo")]}
function exportSheet(){
  sheet(T("Export for the treasurer"),`<label class="f">${T("Period")}<select id="xPer">${[["month","This month"],["lastmonth","Last month"],["year","This year"],["lastyear","Last year"],["custom","Dates…"]]
      .map(([k,l])=>`<option value="${k}">${T(l)}</option>`).join("")}</select></label>
    <div class="grid2" id="xDates" hidden><label class="f">${T("From")}<input type="date" id="xFrom" value="${today().slice(0,8)}01"></label><label class="f">${T("To")}<input type="date" id="xTo" value="${today()}"></label></div>
    <label class="f">${T("Show")}<select id="xWhat"><option value="all">${T("Everything")}</option><option value="ammo">${T("Ammo")}</option><option value="fees">${T("Fees & merch")}</option></select></label>
    <label class="check"><input type="checkbox" id="xUnpaid"> ${T("Only not paid")}</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="primary" data-x="pdf">PDF</button><button type="button" class="ghost" data-x="xlsx">Excel</button><button type="button" class="ghost" data-x="csv">CSV</button></div>
    <p class="hint" style="margin:0">${T("hintExport")}</p>`,null);
  $("sBody").onchange=e=>{if(e.target.id==="xPer")$("xDates").hidden=e.target.value!=="custom"};
  $("sBody").onclick=async e=>{const b=e.target.closest("[data-x]");if(!b)return;
    const[from,to]=periodOf(v("xPer"));if(!from||!to||from>to){$("sMsg").textContent=T("Check the dates.");$("sMsg").hidden=false;return}
    const q=`c/${SLUG}/export?from=${from}&to=${to}&what=${v("xWhat")}&unpaid=${$("xUnpaid").checked?1:0}&lang=${LANG}`;
    if(b.dataset.x!=="pdf"){location.href="/ammo/api/"+q+"&fmt="+b.dataset.x;return}
    b.disabled=true;try{await exportPdf(await api("GET",q+"&fmt=json"))}catch(err){$("sMsg").textContent=err.message;$("sMsg").hidden=false}finally{b.disabled=false}};

function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportPdf(d){

    const all=st=>its.every(i=>(SA[st]||[]).includes(i.id));
    el.innerHTML=`<div class="sarow"><b>${T("All stages")}</b><span>${its.map(i=>chip("all",i,Array.from({length:ns},(_,k)=>(SA[k+1]||[]).includes(i.id)).every(Boolean))).join("")}</span></div>`+
      Array.from({length:ns},(_,k)=>`<div class="sarow"><b>${T("Stage")} ${k+1}</b><span>${its.map(i=>chip(k+1,i,(SA[k+1]||[]).includes(i.id))).join("")}</span></div>`).join("")};
  sheet(n?T("New match"):T("Edit {name}",{name:m.name}),`${MS.ssi?"":`<p class="hint" style="margin:0">${T("hintSsiSetup")}</p>`}<div class="f"${MS.ssi?"":" hidden"}>${T("SSI link (optional)")}<div style="display:flex;gap:8px">
      <input type="url" id="maSsi" inputmode="url" autocapitalize="none" maxlength="200" style="flex:1;min-width:0" value="${esc(m.ssi_url||"")}" placeholder="https://shootnscoreit.com/event/22/…">
      <button type="button" class="ghost" id="maFetch">${T("Fetch")}</button></div></div>
    <p class="hint" style="margin:-6px 0 0" id="maInfo"${MS.ssi?"":" hidden"}>${T("hintSsiLink")}</p>
    <label class="f">${T("Name")}<input type="text" id="maName" maxlength="80" value="${esc(m.name)}" placeholder="${T("e.g. SRA tiistai")}"></label>
    <div class="grid2"><label class="f">${T("Date")}<input type="date" id="maDate" value="${m.date}"></label>
      <label class="f">${T("Stages")}<input type="number" inputmode="numeric" min="1" max="30" id="maSt" value="${m.stages}"></label></div>
    <div class="f">${T("Club ammo boxes at the match")}${boxes.map(b=>`<label class="check"><input type="checkbox" data-mbox="${b.id}" ${m.boxes.includes(b.id)?"checked":""}> ${esc(b.name)} · ${esc(b.cals.join(" + "))}</label>`).join("")}</div>
    <p class="hint" style="margin:-6px 0 0">${T("hintMatchBoxes")}</p>
    <div class="f">${T("Default ammo per stage (optional)")}<div id="maSA" style="display:flex;flex-direction:column;gap:6px"></div></div>
    <p class="hint" style="margin:-6px 0 0">${T("hintStageAmmo")}</p>`,
    async()=>{const r=await api("POST",`c/${SLUG}/matches`,{id:m.id,name:v("maName"),date:v("maDate"),stages:v("maSt"),ssi_url:(v("maSsi")||"").trim(),
      boxes:[...document.querySelectorAll("[data-mbox]:checked")].map(x=>+x.dataset.mbox),
      stage_ammo:Object.fromEntries(Object.entries(SA).map(([k,ids])=>[k,ids.filter(id=>mItems().some(i=>i.id===id))]).filter(([k,ids])=>ids.length&&+k<=+v("maSt")))});toast(T("Saved"));lsSet("ammo:adminmatch",r.id);
      if(got&&got.competitors.length){const c=await api("POST",`c/${SLUG}/matches/${r.id}/competitors`,{rows:got.competitors});toast(T("{n} competitors added",{n:c.added}))}
      setTimeout(()=>loadMatches(r.id),0)});
  drawSA();
  $("sBody").onchange=e=>{if(e.target.matches("[data-mbox]"))drawSA()};
  $("sBody").oninput=e=>{if(e.target.id==="maSt")drawSA()};
  $("sBody").onclick=e=>{const b=e.target.closest("[data-sa]");if(!b)return;const id=+b.dataset.it,on=b.getAttribute("aria-pressed")!=="true",ns=Math.max(1,Math.min(30,+v("maSt")||1));
    const put=st=>{const l=(SA[st]||[]).filter(x=>x!==id);SA[st]=on?l.concat(id):l};
    if(b.dataset.sa==="all")for(let k=1;k<=ns;k++)put(k);else put(+b.dataset.sa);drawSA()};
  $("maFetch").onclick=async()=>{const b=$("maFetch");b.disabled=true;$("maInfo").textContent=T("Reading SSI…");
    try{got=await ssiFetch(v("maSsi"));if(got.name)$("maName").value=got.name;if(got.date)$("maDate").value=got.date;if(got.stages){$("maSt").value=got.stages;drawSA()}
      $("maInfo").textContent=T("From SSI: {name} · {date} · {s} stages · {n} competitors. Tick the boxes and Save – the competitors are added with their squads.",
        {name:got.name||"?",date:got.date?fiDate(got.date):"?",s:got.stages||"?",n:got.competitors.length})}
    catch(err){$("maInfo").textContent=err.message+" "+T("You can still fill in the match by hand and paste the table.")}finally{b.disabled=false}};
}
$("mNew").addEventListener("click",()=>matchSheet(null));

/* The reconciliation for the treasurer / match director: one row per competitor and ammo */
async function matchExport(fmt){
  const m=MD.match,cal=id=>{const i=MD.items.find(x=>x.id===id);return i?i.calibre+(i.name?" "+i.name:""):"?"},price=id=>(MD.items.find(x=>x.id===id)||{}).price||0;
  const head=[T("Name"),T("Number"),T("Squad"),T("Ammo"),T("Officers"),T("Own entry"),T("Difference"),T("Missing €"),T("Not paid €"),T("Status"),T("Code")];
  const rows=[];MD.report.forEach(r=>r.lines.forEach((l,i)=>rows.push([r.name,r.num,r.squad,cal(l.item),l.officer,l.own,l.own-l.officer,
    Math.max(0,l.officer-l.own)*price(l.item),i?0:r.unpaid,T(ST[r.status][0]),r.refs.join(" ")])));
  const tot=[T("Total"),"","","",rows.reduce((a,r)=>a+r[4],0),rows.reduce((a,r)=>a+r[5],0),"",rows.reduce((a,r)=>a+r[7],0),rows.reduce((a,r)=>a+r[8],0),"",""];
  const file=`${SLUG}-${m.date}-${m.name.replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,30)}`,money=n=>typeof n==="number"&&n?(Math.round(n*100)/100).toFixed(2):"";
  if(fmt==="csv"){
    const q=c=>{c=String(c==null?"":c);return/[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c},dec=n=>LANG==="fi"?String(n).replace(".",","):String(n);
    const out=[head].concat(rows.map(r=>r.map((c,i)=>i===7||i===8?dec(money(c)):c)),[tot.map((c,i)=>i===7||i===8?dec(money(c)):c)]).map(r=>r.map(q).join(";")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out],{type:"text/csv;charset=utf-8"}));a.download=file+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}
  await loadScript("/diary/static/vendor/jspdf.umd.min.js");await loadScript("/diary/static/vendor/jspdf.plugin.autotable.min.js");
  const doc=new window.jspdf.jsPDF({unit:"pt",format:"a4",orientation:"landscape"}),M=36,num=n=>money(n)?eur(n).replace(" €",""):"";
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text(`${S.club.name} · ${m.name}`,M,M+8);
  doc.setFont("helvetica","normal");doc.setFontSize(10);
  doc.text(`${T("Reconciliation")} · ${LANG==="fi"?fiDate(m.date):m.date} · ${T("{n} stages",{n:m.stages})} · ${T("made {d}",{d:LANG==="fi"?fiDate(today()):today()})}`,M,M+26);
  doc.autoTable({startY:M+38,margin:{left:M,right:M},theme:"grid",styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:[60,60,60]},
    head:[head],body:rows.map(r=>r.map((c,i)=>i===7||i===8?num(c):c)),foot:[tot.map((c,i)=>i===7||i===8?num(c):c)],
    footStyles:{fillColor:[230,230,230],textColor:20,fontStyle:"bold"},columnStyles:{4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"},8:{halign:"right"}}});
  doc.save(file+".pdf");
}

/* Paste from SSI: copy the participants table on shootnscoreit.com, paste here, pick which column is which */
const COLS=[["","—"],["name","Name"],["first","First name"],["last","Last name"],["squad","Squad"],["division","Division"],["num","Number"]];
function parsePaste(t){
  let rows=t.split(/\r?\n/).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
  const tab=rows.some(l=>l.includes("\t"));
  rows=rows.map(l=>(tab?l.split("\t"):l.split(/\s{2,}/)).map(c=>c.trim()));
  return rows.filter(r=>r.some(Boolean));
}
function guessCols(rows){
  const head=rows[0]||[],w=Math.max(0,...rows.map(r=>r.length)),out=[];let hdr=false;
  for(let i=0;i<w;i++){
    const h=(head[i]||"").toLowerCase(),vals=rows.slice(1,30).map(r=>r[i]||"");
    let g=/^(competitor|name|nimi|shooter|ampuja)$/.test(h)?"name":/first|etunimi/.test(h)?"first":/last|sukunimi/.test(h)?"last":
      /squad|ryhmä|sq/.test(h)?"squad":/division|divisioona|luokka|class/.test(h)?"division":/^(#|no\.?|nr|num|number|numero|id)$/.test(h)?"num":"";
    if(g)hdr=true;
    if(!g&&vals.length&&vals.filter(x=>/^\d{1,4}$/.test(x)).length>=vals.length*.8)g=out.includes("num")?"":"num";
    if(!g&&vals.length&&vals.filter(x=>/^[^\d\s]+(?:[ -][^\d\s]+)+$/.test(x)).length>=vals.length*.7&&!out.includes("name"))g="name";
    out.push(g);
  }
  return{cols:out,hdr};
}
async function ssiFetch(url){
  if(!/shootnscoreit\.com\/event\/\d+\/\d+/.test(url||""))throw new Error(T("Paste the match's link from shootnscoreit.com."));
  return api("POST",`c/${SLUG}/ssi`,{url})}
function pasteSheet(){
  let rows=[],cols=[],hdr=false;
  const has=MD.competitors.length,locked=MD.counts.some(c=>c.qty>0);
  sheet(T("Paste from SSI"),`<p class="hint" style="margin:0">${T("hintPasteHow")}</p>
    <textarea id="pTxt" rows="6" style="font-family:var(--f-mono);font-size:.8rem" placeholder="${T("Paste the table here")}"></textarea>
    <div id="pMap"></div>
    ${has?`<label class="check"><input type="checkbox" id="pRep" ${locked?"disabled":""}> ${T("Replace the current list ({n})",{n:has})}</label>${locked?`<p class="hint" style="margin:-6px 0 0">${T("Officers have entered rounds – new names are added to the list.")}</p>`:""}`:""}`,
    async()=>{const out=build();if(!out.length)throw new Error(T("No names found – pick the name column."));
      const r=await api("POST",`c/${SLUG}/matches/${MD.match.id}/competitors`,{replace:!!($("pRep")&&$("pRep").checked),rows:out});
      toast(T("{n} competitors added",{n:r.added}));setTimeout(loadMatch,0)},T("Import"));
  const build=()=>rows.slice(hdr?1:0).map(r=>{const o={};cols.forEach((c,i)=>{if(c)o[c]=(o[c]?o[c]+" ":"")+(r[i]||"")});
    if(!o.name&&(o.first||o.last))o.name=[o.first,o.last].filter(Boolean).join(" ");let nm=(o.name||"").trim();const lf=nm.match(/^([^,]+),\s*([^,]+)$/);if(lf)nm=lf[2]+" "+lf[1];           // "Last, First" → "First Last"
    return{name:nm,squad:(o.squad||"").replace(/^(squad|ryhmä|sq)\.?\s*/i,""),division:o.division||"",num:o.num||""}}).filter(r=>r.name.length>=2);
  const draw=()=>{if(!rows.length){$("pMap").innerHTML="";return}
    const w=cols.length,show=rows.slice(0,6);
    $("pMap").innerHTML=`<label class="check"><input type="checkbox" id="pHdr" ${hdr?"checked":""}> ${T("First row is the headings")}</label>
      <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:.8rem;min-width:100%"><thead><tr>${cols.map((c,i)=>`<th style="padding:4px"><select data-col="${i}" style="font-size:.8rem;padding:4px">${COLS.map(([k,l])=>`<option value="${k}" ${k===c?"selected":""}>${T(l)}</option>`).join("")}</select></th>`).join("")}</tr></thead>
      <tbody>${show.map((r,j)=>`<tr style="${j===0&&hdr?"opacity:.5":""}">${Array.from({length:w},(_,i)=>`<td style="padding:4px;border-top:1px solid var(--line);white-space:nowrap">${esc(r[i]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <p class="hint" style="margin:0">${T("{n} competitors, e.g. {ex}",{n:build().length,ex:esc(build().slice(0,3).map(r=>r.name+(r.squad?" ("+r.squad+")":"")).join(", "))})}</p>`};
  $("sBody").oninput=e=>{if(e.target.id!=="pTxt")return;rows=parsePaste(e.target.value);const g=guessCols(rows);cols=g.cols;hdr=g.hdr;draw()};
  $("sBody").onchange=e=>{if(e.target.dataset.col!=null){cols[+e.target.dataset.col]=e.target.value;draw()}else if(e.target.id==="pHdr"){hdr=e.target.checked;draw()}};
}

/* ---- tabs ---- */
function tab(t){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===t));
  $("tStock").hidden=t!=="stock";$("tLog").hidden=t!=="log";$("tSetup").hidden=t!=="setup";$("tFees").hidden=t!=="fees";$("tMatch").hidden=t!=="match";
  $("exportRow").hidden=!isAdmin();
  if(t==="log"&&!LOG)loadLog();if(t==="fees")loadFees();if(t==="match")loadMatches();try{sessionStorage.setItem("ammo:tab",t)}catch(e){}}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.tab==="log")LOG_BOX=null,LOG=null;tab(b.dataset.tab)}));
applyLang();
load().then(()=>{let t="stock";try{t=sessionStorage.getItem("ammo:tab")||"stock"}catch(e){}if((t==="setup"||t==="fees"||t==="match")&&!isAdmin())t="stock";tab(t)}).catch(e=>{$("warn").innerHTML=`<div class="msg">${esc(e.message)}</div>`});
</script>
