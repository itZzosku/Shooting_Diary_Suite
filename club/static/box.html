<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Club ammo</title>
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141714" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="/diary/static/icons/favicon-32.png">
<link rel="preload" href="/diary/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/diary/static/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/diary/static/fonts/fonts.css">
<link rel="stylesheet" href="/ammo/static/club.css">
<style>
.langs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;align-self:flex-start}
.langs button{background:none;border:0;border-radius:999px;padding:6px 11px;font-weight:600;font-size:.85rem;color:var(--fg);min-width:40px}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
header.top{align-items:flex-start}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker" id="clubName">Club ammo</div>
      <h1 id="boxName">Ammo box</h1>
      <div class="hint" id="boxCal"></div>
    </div>
    <div class="langs" role="group" aria-label="Kieli / Språk / Language" id="langs">
      <button type="button" data-lang="fi" lang="fi">FI</button><button type="button" data-lang="sv" lang="sv">SV</button><button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <div class="banner" id="note" hidden></div>
  <div class="msg" id="loadMsg" hidden></div>

  <!-- The form -->
  <form id="form" class="wrap" style="gap:16px" autocomplete="on" novalidate hidden>
    <div class="grid2">
      <label class="f"><span data-t="name">Your name</span><input type="text" id="fName" name="name" autocomplete="name" maxlength="60" required></label>
      <label class="f"><span data-t="date">Date</span><input type="date" id="fDate" required></label>
    </div>
    <div id="lines" style="display:flex;flex-direction:column;gap:10px"></div>
    <button type="button" class="chip add" id="addLine" hidden data-t="another">+ another ammo</button>

    <div class="total"><span class="hint" id="totalTxt">Total</span><b id="total">0.00 €</b></div>

    <label class="check" id="paidRow"><input type="checkbox" id="fPaid" checked> <span id="paidTxt">I'm paying now with MobilePay</span></label>
    <label class="check" id="diaryRow" hidden><input type="checkbox" id="fDiary" checked> <span><span data-t="diary">Also add to my diary</span> <span class="hint" id="diaryUser"></span></span></label>
    <input class="hp" type="text" id="fWebsite" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="msg" id="msg" hidden></div>
    <button type="submit" class="primary big" id="saveBtn" data-t="save">Save</button>
    <p class="hint" style="margin:0" id="loginHint" hidden data-th="loginHint"></p>
  </form>

  <!-- After saving -->
  <section id="done" class="wrap" style="gap:14px" hidden>
    <div class="pay" id="pay"></div>
    <button type="button" class="ghost wide" id="again" data-t="again">New entry</button>
  </section>

  <section id="mineBox" hidden>
    <h2 style="margin-bottom:6px" data-t="mine">On this phone</h2>
    <div class="rows" id="mine"></div>
  </section>

  <p class="hint" style="margin:0"><a href="/diary/privacy#club" data-t="privacy">Privacy</a> · <span data-t="privacyTxt"></span></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const CODE=location.pathname.replace(/\/+$/,"").split("/").pop();
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>{const s=(Math.round((+n||0)*100)/100).toFixed(2);return(typeof LANG!=="undefined"&&LANG!=="en"?s.replace(".",","):s)+" €"};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fiDate=s=>{const[y,m,d]=s.split("-");return +d+"."+ +m+"."+y};
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
const DEVICE=lsGet("ammo:device")||(()=>{const d=rid();lsSet("ammo:device",d);return d})();
const QUICK=[25,50,100,200];
const S={info:null,lines:[],done:null};

/* ---- languages: Finnish, Swedish, English; the choice is remembered on the phone ---- */
const L={
fi:{title:"Seuran patruunat",name:"Nimesi",date:"Päivämäärä",ammo:"Patruuna",rounds:"Patruunoita (kpl)",perRound:"€ / kpl",
  another:"+ toinen patruuna",total:"Yhteensä",nRounds:"{n} kpl",payNow:"Maksan nyt MobilePaylla",paid:"Maksettu",
  diary:"Lisää myös ampumapäiväkirjaani",save:"Tallenna",
  loginHint:'Onko sinulla <a href="/diary/login">Shooting Diary</a> -tunnus? Kirjaudu, niin nimesi täyttyy itsestään.',
  again:"Uusi kirjaus",mine:"Tällä puhelimella",privacy:"Tietosuoja",
  privacyTxt:"Nimesi, patruunat ja päivä tallentuvat seuran patruunakirjanpitoon. Seuran ylläpitäjät näkevät ne.",
  offline:"Ei yhteyttä – kirjaukset säilyvät puhelimessa ja lähetetään, kun yhteys palaa.",
  badLink:"Tämän laatikon linkki ei enää toimi. Skannaa laatikon QR-koodi uudelleen tai kysy seuran ylläpitäjältä.",
  unknownBox:"Tuntematon laatikko",noConn:"Ei yhteyttä. Avaa sivu kerran verkossa, niin se toimii sen jälkeen myös ilman yhteyttä.",
  noItems:"Laatikossa ei ole vielä hinnoiteltuja patruunoita – kysy seuran ylläpitäjältä.",
  errName:"Kirjoita nimesi.",errRounds:"Lisää patruunoiden määrä.",errMax:"Enintään 5000 kpl riville.",errDate:"Tarkista päivämäärä.",
  errGone:"Tätä patruunaa ei enää ole laatikossa – lataa sivu uudelleen.",errBusy:"Liian monta kirjausta – yritä myöhemmin uudelleen.",
  errOld:"Yli 30 minuuttia vanha – pyydä seuran ylläpitäjää korjaamaan.",saved:"✓ Tallennettu",savedPhone:"✓ Tallennettu puhelimeen",
  sentLater:"Lähetetään, kun yhteys palaa.",copy:"Kopioi",copied:"Kopioitu",openMp:"Avaa MobilePay",payWith:"Maksa {amt} viestillä",
  payTo:"MobilePay numeroon",message:"Viesti",notPaidLater:"Merkitty maksamattomaksi – maksa myöhemmin seuran ylläpitäjälle.",
  diaryOk:"Lisätty päiväkirjaasi.",diaryFail:"Päiväkirjaan lisääminen ei onnistunut.",sentN:"Lähetetty {n} tallennettua kirjausta",
  waiting:"odottaa lähetystä",notPaid:"maksamatta",takenBack:"peruttu",ref:"koodi",takeBack:"Peru",tapAgain:"Napauta uudelleen perutaksesi",
  takenToast:"Peruttu",remove:"Poista",fewer:"Vähemmän",more:"Enemmän"},
sv:{title:"Föreningens patroner",name:"Ditt namn",date:"Datum",ammo:"Patron",rounds:"Patroner (st)",perRound:"€ / st",
  another:"+ annan patron",total:"Totalt",nRounds:"{n} st",payNow:"Jag betalar nu med MobilePay",paid:"Betalt",
  diary:"Lägg också till i min skjutdagbok",save:"Spara",
  loginHint:'Har du ett <a href="/diary/login">Shooting Diary</a>-konto? Logga in så fylls ditt namn i automatiskt.',
  again:"Ny registrering",mine:"På den här telefonen",privacy:"Dataskydd",
  privacyTxt:"Ditt namn, patronerna och datumet sparas i föreningens patronbokföring. Föreningens administratörer ser dem.",
  offline:"Ingen anslutning – registreringarna sparas i telefonen och skickas när anslutningen är tillbaka.",
  badLink:"Länken till den här lådan fungerar inte längre. Skanna lådans QR-kod igen eller fråga en administratör.",
  unknownBox:"Okänd låda",noConn:"Ingen anslutning. Öppna sidan en gång med nätverk så fungerar den sedan även utan.",
  noItems:"Det finns ännu inga prissatta patroner i lådan – fråga en administratör.",
  errName:"Skriv ditt namn.",errRounds:"Ange antalet patroner.",errMax:"Högst 5000 st per rad.",errDate:"Kontrollera datumet.",
  errGone:"Den patronen finns inte längre i lådan – ladda om sidan.",errBusy:"För många registreringar – försök igen senare.",
  errOld:"Äldre än 30 minuter – be en administratör rätta den.",saved:"✓ Sparat",savedPhone:"✓ Sparat i telefonen",
  sentLater:"Skickas när anslutningen är tillbaka.",copy:"Kopiera",copied:"Kopierat",openMp:"Öppna MobilePay",payWith:"Betala {amt} med meddelandet",
  payTo:"MobilePay till",message:"Meddelande",notPaidLater:"Markerad som obetald – betala en administratör senare.",
  diaryOk:"Tillagt i din dagbok.",diaryFail:"Kunde inte läggas till i dagboken.",sentN:"Skickade {n} sparade registreringar",
  waiting:"väntar på att skickas",notPaid:"obetald",takenBack:"ångrad",ref:"kod",takeBack:"Ångra",tapAgain:"Tryck igen för att ångra",
  takenToast:"Ångrad",remove:"Ta bort",fewer:"Färre",more:"Fler"},
en:{title:"Club ammo",name:"Your name",date:"Date",ammo:"Ammo",rounds:"Rounds",perRound:"€ / round",
  another:"+ another ammo",total:"Total",nRounds:"{n} rounds",payNow:"I'm paying now with MobilePay",paid:"Paid",
  diary:"Also add to my diary",save:"Save",
  loginHint:'Have a <a href="/diary/login">Shooting Diary</a> account? Log in and your name fills in by itself.',
  again:"New entry",mine:"On this phone",privacy:"Privacy",
  privacyTxt:"Your name, the rounds and the date go to the club's ammo log. Admins of the club see them.",
  offline:"Offline – entries are kept on this phone and sent when there's a connection.",
  badLink:"This box link doesn't work any more. Scan the QR code on the box again, or ask a club admin.",
  unknownBox:"Unknown box",noConn:"No connection. Open this page once while online and it works offline after that.",
  noItems:"No ammo with a price in this box yet – ask a club admin.",
  errName:"Write your name.",errRounds:"Add the rounds.",errMax:"Rounds: at most 5000 per line.",errDate:"Check the date.",
  errGone:"That ammo isn't in this box any more – reload the page.",errBusy:"Too many entries from here – try again later.",
  errOld:"Older than 30 minutes – ask a club admin to fix it.",saved:"✓ Saved",savedPhone:"✓ Saved on this phone",
  sentLater:"It's sent when there's a connection.",copy:"Copy",copied:"Copied",openMp:"Open MobilePay",payWith:"Pay {amt} with the message",
  payTo:"MobilePay to",message:"Message",notPaidLater:"Marked as not paid yet – pay a club admin later.",
  diaryOk:"Added to your diary.",diaryFail:"Couldn't add it to your diary.",sentN:"Sent {n} saved entries",
  waiting:"waiting to be sent",notPaid:"not paid",takenBack:"taken back",ref:"ref",takeBack:"Take back",tapAgain:"Tap again to take back",
  takenToast:"Taken back",remove:"Remove",fewer:"Fewer",more:"More"}};
let LANG=lsGet("ammo:lang")||((navigator.language||"").toLowerCase().startsWith("sv")?"sv":"fi");
if(!L[LANG])LANG="fi";
const t=(k,v)=>{let s=L[LANG][k]||L.en[k]||k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
// Server messages (English) → this language
const SERVER_ERR=[["Write your name","errName"],["Check the date","errDate"],["Add the rounds","errRounds"],["That ammo","errGone"],
  ["Rounds:","errMax"],["Too many","errBusy"],["Older than","errOld"],["not_found","badLink"]];
const tErr=m=>{const hit=SERVER_ERR.find(([p])=>String(m).startsWith(p));return hit?t(hit[1]):m};
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("#langs [data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el=>el.innerHTML=t(el.dataset.th));
  if(!S.info){$("clubName").textContent=t("title");return}
  paidLabel();renderLines();if(S.done)showDone(S.done.r,S.done.q,true);loadMine();
  if(!$("note").hidden)note(t("offline"));
}
$("langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;LANG=b.dataset.lang;lsSet("ammo:lang",LANG);applyLang()});

async function api(method,path,body){
  const r=await fetch("/ammo/api/"+path,{method,credentials:"same-origin",
    headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.headers.get("X-Offline"))note(t("offline"));
  if(!r.ok){const e=new Error(tErr((j&&j.error)||("HTTP "+r.status)));if(!(j&&j.error==="offline"))e.status=r.status;throw e}   // offline (service worker) = no status
  return j;
}

/* ---- load the box ---- */
async function load(){
  let info=null;
  try{info=await api("GET","b/"+CODE);lsSet("ammo:box:"+CODE,info)}
  catch(e){
    if(e.status===404){$("loadMsg").textContent=t("badLink");$("loadMsg").hidden=false;$("boxName").textContent=t("unknownBox");return}
    info=lsGet("ammo:box:"+CODE);
    if(!info){$("loadMsg").textContent=t("noConn");$("loadMsg").hidden=false;return}
    note(t("offline"));
  }
  S.info=info;
  document.title=info.box.name+" · "+info.club.name;
  $("clubName").textContent=info.club.name;$("boxName").textContent=info.box.name;$("boxCal").textContent=info.box.calibre;
  if(!info.items.length){$("loadMsg").textContent=t("noItems");$("loadMsg").hidden=false;return}
  const remembered=lsGet("ammo:name");
  $("fName").value=(info.me&&info.me.name)||remembered||"";
  $("fDate").value=today();$("fDate").max=today();
  if(!S.lines.length)S.lines=[{item:info.items[0].id,qty:""}];
  S.lines.forEach(l=>{if(!info.items.some(i=>i.id===l.item))l.item=info.items[0].id});
  paidLabel();
  $("diaryRow").hidden=!info.me;$("loginHint").hidden=!!info.me;
  if(info.me){$("diaryUser").textContent="("+info.me.user+")";const d=lsGet("ammo:diary");$("fDiary").checked=d===null?true:!!d}
  $("form").hidden=false;renderLines();
  loadMine();
}
function note(s){$("note").textContent=s;$("note").hidden=!s}
function paidLabel(){const mp=S.info.club.mobilepay;
  $("paidTxt").innerHTML=S.info.box.pay_url?esc(t("payNow")):mp?`${esc(t("payNow"))} <span class="hint">(${esc(mp)})</span>`:esc(t("paid"))}

/* ---- ammo lines ---- */
function itemOf(id){return S.info.items.find(i=>i.id===id)}
function renderLines(){
  const its=S.info.items,many=its.length>1;
  $("lines").innerHTML=S.lines.map((l,i)=>`<div class="line" data-i="${i}">
    ${many||S.lines.length>1?`<div class="line-top">${many?`<label class="f" style="flex:1">${t("ammo")}<select data-k="item">${its.map(it=>
      `<option value="${it.id}" ${it.id===l.item?"selected":""}>${esc(it.name||S.info.box.calibre)} – ${eur(it.price).replace(" €","")} ${t("perRound")}</option>`).join("")}</select></label>`
      :`<span class="hint">${esc(itemOf(l.item).name||S.info.box.calibre)}</span>`}
      ${S.lines.length>1?`<button type="button" class="rm" data-rm="${i}" aria-label="${t("remove")}">✕</button>`:""}</div>`
      :`<div class="hint">${esc(its[0].name||S.info.box.calibre)} · ${eur(its[0].price).replace(" €","")} ${t("perRound")}</div>`}
    <label class="f">${t("rounds")}<div class="step"><button type="button" data-d="-1" aria-label="${t("fewer")}">−</button>
      <input type="number" inputmode="numeric" min="1" max="5000" step="1" data-k="qty" value="${esc(l.qty)}" placeholder="0">
      <button type="button" data-d="1" aria-label="${t("more")}">+</button></div></label>
    <div class="chips">${QUICK.map(q=>`<button type="button" class="chip" data-q="${q}" aria-pressed="${+l.qty===q}">${q}</button>`).join("")}</div>
  </div>`).join("");
  $("addLine").hidden=!(many&&S.lines.length<its.length);
  total();
}
function total(){
  const sum=S.lines.reduce((a,l)=>a+(+l.qty||0)*(+((itemOf(l.item)||{}).price)||0),0),n=S.lines.reduce((a,l)=>a+(+l.qty||0),0);
  $("total").textContent=eur(sum);$("totalTxt").textContent=n?`${t("total")} · ${t("nRounds",{n})}`:t("total");
}
$("lines").addEventListener("input",e=>{const el=e.target,i=+el.closest(".line").dataset.i;
  if(el.dataset.k==="qty"){S.lines[i].qty=el.value.replace(/\D/g,"");el.closest(".line").querySelectorAll("[data-q]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.q===+S.lines[i].qty));total()}});
$("lines").addEventListener("change",e=>{const el=e.target,i=+el.closest(".line").dataset.i;
  if(el.dataset.k==="item"){S.lines[i].item=+el.value;total()}});
$("lines").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.closest(".line").dataset.i,l=S.lines[i];
  if(b.dataset.q){l.qty=b.dataset.q;renderLines()}
  else if(b.dataset.d){l.qty=String(Math.max(0,(+l.qty||0)+ +b.dataset.d)||"");renderLines()}
  else if(b.dataset.rm){S.lines.splice(i,1);renderLines()}});
$("addLine").addEventListener("click",()=>{const used=new Set(S.lines.map(l=>l.item));const it=S.info.items.find(i=>!used.has(i.id))||S.info.items[0];
  S.lines.push({item:it.id,qty:""});renderLines()});
$("fDiary").addEventListener("change",()=>lsSet("ammo:diary",$("fDiary").checked));

/* ---- save (or keep on the phone when offline) ---- */
const QK="ammo:queue";
$("form").addEventListener("submit",async e=>{
  e.preventDefault();$("msg").hidden=true;
  const name=$("fName").value.trim().replace(/\s+/g," ");
  const lines=S.lines.filter(l=>+l.qty>0).map(l=>({item:l.item,qty:+l.qty}));
  const err=name.length<2?t("errName"):!lines.length?t("errRounds"):lines.some(l=>l.qty>5000)?t("errMax"):"";
  if(err){$("msg").textContent=err;$("msg").hidden=false;return}
  lsSet("ammo:name",name);
  const body={name,date:$("fDate").value||today(),lines,paid:$("fPaid").checked,diary:!!(S.info.me&&$("fDiary").checked),
    device:DEVICE,client_id:rid(),website:$("fWebsite").value};
  $("saveBtn").disabled=true;
  try{showDone(await api("POST","b/"+CODE+"/use",body))}
  catch(err){
    if(err.status){$("msg").textContent=err.message;$("msg").hidden=false}
    else{const q=lsGet(QK)||[];q.push({code:CODE,body});lsSet(QK,q);showDone(null,body)}
  }finally{$("saveBtn").disabled=false}
});
function showDone(r,queued,again){
  S.done={r,q:queued};
  const mp=S.info.club.mobilepay,url=S.info.box.pay_url;
  const msg=r?((S.info.club.pay_msg?S.info.club.pay_msg+" ":"")+r.ref):"";      // e.g. HARRASTEMAKSU A7K3
  const amt=r?r.total:S.lines.reduce((a,l)=>a+(+l.qty||0)*(+itemOf(l.item).price||0),0);
  const paying=r?r.paid:queued.paid;
  const C=t("copy");
  $("pay").innerHTML=(r?`<div class="ok">${t("saved")}</div>`:`<div class="ok">${t("savedPhone")}</div><div class="hint">${t("sentLater")}</div>`)+
    `<div class="amt">${eur(amt)} <button type="button" class="copy" data-copy="${(Math.round(amt*100)/100).toFixed(2).replace(".",",")}">${C}</button></div>`+
    (paying&&url?`<a class="primary big" style="text-decoration:none;display:block" href="${esc(url)}">${t("openMp")}</a>`+
      `<div class="hint">${r?`${t("payWith",{amt:eur(amt)})}<br><b class="num" style="white-space:nowrap">${esc(msg)}</b> <button type="button" class="copy" data-copy="${esc(msg)}">${C}</button>`:""}</div>`:
     paying&&mp?`<div class="to">${t("payTo")} <b>${esc(mp)}</b> <button type="button" class="copy" data-copy="${esc(mp)}">${C}</button></div>`+
      (r?`<div class="ref">${t("message")}: <b>${esc(msg)}</b> <button type="button" class="copy" data-copy="${esc(msg)}">${C}</button></div>`:""):
     !paying?`<div class="hint">${t("notPaidLater")}</div>`:"")+
    (r&&r.diary?`<div class="hint">${t("diaryOk")}</div>`:r&&r.diary===false?`<div class="msg">${t("diaryFail")}</div>`:"");
  if(again)return;
  $("form").hidden=true;$("done").hidden=false;window.scrollTo(0,0);
  loadMine();
}
$("pay").addEventListener("click",async e=>{const b=e.target.closest("[data-copy]");if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.copy);toast(t("copied"))}catch(err){toast(b.dataset.copy)}});
$("again").addEventListener("click",()=>{S.done=null;S.lines=[{item:S.info.items[0].id,qty:""}];$("fDate").value=today();$("done").hidden=true;$("form").hidden=false;renderLines()});

async function flush(){
  const q=lsGet(QK)||[];if(!q.length)return;
  const left=[];
  for(const x of q){
    try{await api("POST","b/"+x.code+"/use",x.body)}
    catch(e){if(!e.status)left.push(x);else if(e.status===429)left.push(x)}     // a rejected entry (bad link) is dropped
  }
  lsSet(QK,left);
  if(left.length<q.length){toast(t("sentN",{n:q.length-left.length}));note("");loadMine()}
}

/* ---- this phone's entries; take one back within the time limit ---- */
async function loadMine(){
  let r;try{r=await api("POST","b/"+CODE+"/mine",{device:DEVICE})}catch(e){return}
  const q=(lsGet(QK)||[]).filter(x=>x.code===CODE);
  const lim=(S.info&&S.info.withdraw_min||30)*60000;
  $("mineBox").hidden=!(r.entries.length||q.length);
  $("mine").innerHTML=q.map(x=>`<div class="row"><div class="what">${fiDate(x.body.date)} · ${t("nRounds",{n:x.body.lines.reduce((a,l)=>a+l.qty,0)})}<br><small>${esc(x.body.name)} · ${t("waiting")}</small></div><div class="r num">…</div></div>`).join("")+
    r.entries.map(x=>{const n=x.lines.reduce((a,l)=>a+l.qty,0),open=!x.voided&&Date.now()-Date.parse(x.at)<lim;
      return`<div class="row${x.voided?" void":""}"><div class="what">${fiDate(x.date)} · ${t("nRounds",{n})}${x.paid?"":`<span class="tag warn">${t("notPaid")}</span>`}${x.voided?`<span class="tag">${t("takenBack")}</span>`:""}<br>
        <small>${esc(x.lines.map(l=>l.item).filter(Boolean).join(", "))} · ${t("ref")} <b class="num">${esc(x.ref)}</b></small></div>
        <div class="r"><div class="num">${eur(x.total)}</div>${open?`<button type="button" class="link" data-wd="${x.grp}">${t("takeBack")}</button>`:""}</div></div>`}).join("");
}
$("mine").addEventListener("click",async e=>{const b=e.target.closest("[data-wd]");if(!b)return;
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent=t("tapAgain");return}
  try{await api("POST","b/"+CODE+"/withdraw/"+b.dataset.wd,{device:DEVICE});toast(t("takenToast"));loadMine()}
  catch(err){toast(err.message)}});

window.addEventListener("online",flush);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/ammo/sw.js",{scope:"/ammo/"}).catch(()=>{});
applyLang();
load().then(()=>{if(S.info)applyLang()}).then(flush);
</script>
</body>
